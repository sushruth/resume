# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build Resume

on:
  push:
    branches: [main]
    paths:
      - "resume.json"
      - ".github/workflows/resume.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# On a PR, a newer push cancels the older run so the preview comment never points at a stale PDF.
concurrency:
  group: resume-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pdf-url: ${{ steps.upload.outputs.artifact-url }}
      html-url: ${{ steps.upload-html.outputs.artifact-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build resume
        uses: usually-frustrated/pause@main
        with:
          resume_file: ${{ github.workspace }}/resume.json
          templates: |
            latex-template
            html-template
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests only build: no release, no tag, no Pages deploy
          # (Pause deploys Pages only as part of creating a release).
          create_release: ${{ github.event_name != 'pull_request' }}
          deploy_github_pages: html-simple
          artifact_name_template: "{name} {MMM} {yyyy} Resume"

      # An unzipped artifact is named after its file, so copy the outputs to the name a reader will download.
      - name: Name preview files
        id: name
        if: github.event_name == 'pull_request'
        run: |
          base="$(jq -r '.basics.name' resume.json | tr ' ' '-')-Resume"
          cp resume.pdf "$base.pdf"
          cp resume.html "$base.html"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Upload PDF preview
        id: upload
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          # Unzipped single-file upload, so the link serves the PDF itself.
          archive: false
          # Pause writes <output_name>.<ext> to the workspace root; the LaTeX template's output_name is "resume".
          path: ${{ github.workspace }}/${{ steps.name.outputs.base }}.pdf
          if-no-files-found: error

      - name: Upload HTML preview
        id: upload-html
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ${{ github.workspace }}/${{ steps.name.outputs.base }}.html
          if-no-files-found: error

  comment:
    name: Comment PDF link on PR
    needs: build
    # Fork PRs get a read-only token, so skip instead of failing.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create or update sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PDF_URL: ${{ needs.build.outputs.pdf-url }}
          HTML_URL: ${{ needs.build.outputs.html-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- resume-pdf-preview -->'
          body="$(printf '%s\n**Resume preview** for %s: [PDF](%s) | [HTML](%s)\n\nYou must be signed in to GitHub to open workflow artifacts.' "$marker" "$SHA" "$PDF_URL" "$HTML_URL")"
          id="$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" --silent
          else
            gh pr comment "$PR" --body "$body"
          fi
